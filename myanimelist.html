<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="icon" type="image/png" href="https://1o1c.org/logo.png">

    <style>
        body {

            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        #wrapper {
            width: 950px;
            margin: 30px auto;
            background-color: #ffffff;
            border: 1px solid #b5c7d9;
            border-radius: 8px;
            padding: 25px;
            text-align: left;
            box-shadow: 0px 4px 20px rgba(160, 180, 200, 0.4);
        }

        h1.logo {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 54px;
            font-weight: bold;
            color: #2980b9;
            margin: 10px 0 5px 0;
            text-align: center;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #7f8c8d;
            font-weight: normal;
            font-size: 15px;
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        #nav-bar {
            border: 1px solid #a4b9cc;
            border-radius: 5px;
            background: #eef3f7;
            background: linear-gradient(to bottom, #f7fafc 0%, #eef3f7 100%);
            padding: 10px;
            text-align: center;
            margin-bottom: 25px;
        }

        #nav-bar a {
            color: #ffffff;
            background: #2980b9;
            background: linear-gradient(to bottom, #3498db 0%, #2980b9 100%);
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            padding: 6px 18px;
            font-size: 14px;
            display: inline-block;
        }

        .section-header {
            background-color: #ebf2f7;
            color: #2c3e50;
            padding: 8px 12px;
            font-weight: bold;
            border-left: 4px solid #2980b9;
            border-radius: 0 4px 4px 0;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .filter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
        }

        .search-input, .type-select {
            padding: 8px 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 13px;
            color: #2c3e50;
        }

        .search-input {
            width: 65%;
        }

        .type-select {
            width: 30%;
        }

        .anime-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .anime-table th {
            background-color: #ebf2f7;
            color: #2c3e50;
            padding: 10px;
            border: 1px solid #d6e0ea;
            text-align: left;
        }

        .anime-table td {
            padding: 8px 10px;
            border: 1px solid #eef3f7;
            color: #556270;
        }

        .anime-table tr:nth-child(even) {
            background-color: #fafbfc;
        }

        .anime-table tr:hover {
            background-color: #f0f4f8;
        }

        .score-badge {
            background-color: #fef9e7;
            color: #d35400;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .status-badge {
            background-color: #e8f8f5;
            color: #27ae60;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eef3f7;
            color: #95a5a6;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="wrapper">

        <h1 class="logo">1O1C</h1>
        <div class="subtitle">Personal Media Directories & Anime Watchlist</div>

        <div id="nav-bar">
            <a href="myrandomlist.html" class="active">My Random List</a>
        </div>

        <p style="line-height: 1.6; color: #556270; font-size: 14px; margin-bottom: 20px;">
            A curated database of personal anime entries along with their official MyAnimeList (MAL) scores and broadcast status.
        </p>

        <div class="section-header">Anime Watchlist Index</div>

        <div class="filter-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search anime title or format..." onkeyup="filterAnime()">
            <select id="statusFilter" class="type-select" onchange="filterAnime()">
                <option value="All">All Statuses</option>
                <option value="Finished Airing">Finished Airing</option>
                <option value="Currently Airing">Currently Airing</option>
            </select>
        </div>

        <table class="anime-table" id="animeTable">
            <thead>
                <tr>
                    <th width="8%">#</th>
                    <th width="45%">Title</th>
                    <th width="15%">Format</th>
                    <th width="16%">MAL Score</th>
                    <th width="16%">Status</th>
                </tr>
            </thead>
            <tbody id="animeBody">
                <!-- Dynamically Populated -->
            </tbody>
        </table>

        <footer>
            &copy; 2026 1O1C Network. Personal Anime Index.
        </footer>

    </div>

        function renderAnime(data) {
            var tbody = document.getElementById('animeBody');
            tbody.innerHTML = '';

            data.forEach(function(item) {
                var tr = document.createElement('tr');

                tr.innerHTML = '<td>' + item.id + '</td>' +
                               '<td><strong>' + item.title + '</strong></td>' +
                               '<td>' + item.type + '</td>' +
                               '<td><span class="score-badge">★ ' + item.score + '</span></td>' +
                               '<td><span class="status-badge">' + item.status + '</span></td>';

                tbody.appendChild(tr);
            });
        }

        function filterAnime() {
            var searchText = document.getElementById('searchInput').value.toLowerCase();
            var selectedStatus = document.getElementById('statusFilter').value;

            var filtered = animeData.filter(function(anime) {
                var matchesSearch = anime.title.toLowerCase().includes(searchText) || 
                                  anime.type.toLowerCase().includes(searchText);
                var matchesStatus = (selectedStatus === 'All') || (anime.status === selectedStatus);
                return matchesSearch && matchesStatus;
            });

            renderAnime(filtered);
        }

        renderAnime(animeData);
    </script>
